name: CI/CD — DataPipe

on:
  push:
    branches: ["blhack", "BACKEND", "main", "Blhack_full"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install & test backend
        run: |
          cd datapipe_backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repo name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./datapipe_backend
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-backend:latest
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./datapipe-app
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}-frontend:latest

  # Déploiement VPS — s'active si la variable DEPLOY_ENABLED=true ou si les secrets SSH sont configurés.
  # Supporte l'ancienne et la nouvelle structure de secrets et de dossiers.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' || secrets.VPS_HOST != '' || secrets.SSH_HOST != '' }}
    steps:
      - name: Deploy over SSH (git pull + docker compose up)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER || secrets.SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_KEY }}
          port: ${{ secrets.VPS_PORT || secrets.SSH_PORT || '22' }}
          script: |
            set -e
            
            # Détection du dossier de déploiement (nouveau vs ancien)
            if [ -n "${{ secrets.VPS_PATH }}" ]; then
              cd "${{ secrets.VPS_PATH }}"
            elif [ -d "$HOME/datapipe" ]; then
              cd "$HOME/datapipe"
            elif [ -d "$HOME/JUNE_HACKATON2026" ]; then
              cd "$HOME/JUNE_HACKATON2026"
            else
              echo "Dossier introuvable, création de ~/datapipe..."
              mkdir -p "$HOME/datapipe"
              cd "$HOME/datapipe"
            fi
            
            echo "Dossier de travail : $(pwd)"
            
            # Récupération du nom de dépôt en minuscules pour l'image
            IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
            
            # Écriture dynamique du docker-compose.yml sur le VPS
            # Utilise l'image du package Docker (GHCR) sans avoir besoin du code source
            printf 'version: "3.8"\n\nservices:\n  backend:\n    image: ghcr.io/%s-backend:latest\n    container_name: datapipe_backend\n    restart: always\n    ports:\n      - "5005:5000"\n    volumes:\n      - datapipe_data:/app/instance\n      - datapipe_uploads:/app/uploads\n    env_file:\n      - .env\n\nvolumes:\n  datapipe_data:\n  datapipe_uploads:\n' "${IMAGE_LOWER}" > docker-compose.yml

            # Connexion au Container Registry de GitHub
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Téléchargement de la nouvelle image et démarrage
            echo "Téléchargement de la nouvelle image ghcr.io/${IMAGE_LOWER}-backend:latest..."
            docker compose pull
            
            echo "Lancement du conteneur..."
            docker compose up -d
            
            # Nettoyage final des images inutilisées
            docker image prune -f
            
            echo "Déploiement terminé avec succès !"
